name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEDIAWORKER_LOAD_DOTENV: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check public source and history
        run: python scripts/check-release.py
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -e '.[downloader,dev]'
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: python -m pip_audit --skip-editable --progress-spinner off
      - name: Build and inspect distributions
        run: |
          python -m build
          python scripts/check-release.py --archive dist/mediaworker-0.1.0.tar.gz
          python scripts/check-release.py --archive dist/mediaworker-0.1.0-py3-none-any.whl
